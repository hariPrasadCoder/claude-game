name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every JS file
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node -c

      - name: Smoke test the server
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:47821/api/status > /dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:47821/api/status
          curl -sf http://127.0.0.1:47821/ > /dev/null
          curl -sf http://127.0.0.1:47821/app.js > /dev/null
          curl -sfX POST http://127.0.0.1:47821/api/heartbeat
          curl -sf -X POST http://127.0.0.1:47821/api/event \
            -H 'Content-Type: application/json' \
            -d '{"sessionId":"ci","event":"prompt-submit"}'
          kill $SERVER_PID

      - name: Simulate hooks end-to-end
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:47821/api/status > /dev/null && break
            sleep 0.2
          done
          echo '{"session_id":"ci-1","hook_event_name":"UserPromptSubmit"}' | node hooks/on-prompt-submit.js
          echo '{"session_id":"ci-1","hook_event_name":"Stop"}' | node hooks/on-stop.js
          [ "$(curl -s http://127.0.0.1:47821/api/status | node -pe 'JSON.parse(require("fs").readFileSync(0)).status')" = "done" ]
          echo '{"session_id":"ci-1","hook_event_name":"PreToolUse","tool_name":"Bash"}' | sh hooks/on-tool-use.sh
          sleep 0.3
          [ "$(curl -s http://127.0.0.1:47821/api/status | node -pe 'JSON.parse(require("fs").readFileSync(0)).status')" = "working" ]
          echo '{"session_id":"ci-1","hook_event_name":"SessionEnd"}' | node hooks/on-session-end.js
          kill $SERVER_PID

      - name: Version endpoint and Notification (waiting) hook
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:47821/api/status > /dev/null && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:47821/api/version
          echo '{"session_id":"ci-2","hook_event_name":"UserPromptSubmit"}' | node hooks/on-prompt-submit.js
          echo '{"session_id":"ci-2","hook_event_name":"Stop"}' | node hooks/on-stop.js
          [ "$(curl -s http://127.0.0.1:47821/api/status | node -pe 'JSON.parse(require("fs").readFileSync(0)).status')" = "done" ]
          echo '{"session_id":"ci-2","hook_event_name":"Notification"}' | node hooks/on-notification.js
          [ "$(curl -s http://127.0.0.1:47821/api/status | node -pe 'JSON.parse(require("fs").readFileSync(0)).status')" = "waiting" ]
          kill $SERVER_PID

      - name: Self-update restarts cleanly (git pull path, since actions/checkout is a real clone)
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:47821/api/status > /dev/null && break
            sleep 0.2
          done
          curl -s -X POST http://127.0.0.1:47821/api/self-update | tee /tmp/self-update-response.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/self-update-response.json")); if(!r.ok) throw new Error("self-update failed: "+r.error)'
          sleep 1
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:47821/api/status > /dev/null && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:47821/api/status
          kill "$(cat ~/.claude-game/run/server.pid)"
